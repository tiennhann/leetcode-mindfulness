<html>
  <head>
    <h1>LeetCode Mindfullness Extension</h1>
  </head>
  <body>

    <div class="form-container">
      <!-- Sign Up Form -->
      <form id="signup-form" class="active">
        <h2>Sign Up</h2>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <button onclick="signUp()">Sign Up</button>
        <span class="toggle-link" onclick="toggleForm()">Already have an account? Sign In</span>
      </form>
    
      <!-- Sign In Form -->
      <form id="signin-form">
        <h2>Sign In</h2>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <button onclick="signIn()">Sign In</button>
        <span class="toggle-link" onclick="toggleForm()">Don't have an account? Sign Up</span>
      </form>
    </div>

    <div>
      <p id="des"></p>
      <p id="output"></p>
      <button id="clickme">Parse</button>
    </div>
  </body>
  <script src="/scripts/main.js"></script>
</html>
